<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse99 -- Uptime Monitor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        sans: ['Inter', 'system-ui', 'sans-serif'],
        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
      },
    }
  }
}
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #09090b; color: #e2e8f0; min-height: 100vh; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .animate-fade { animation: fadeIn 0.2s ease-out; }
  .pulse { animation: pulse 2s infinite; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  canvas { max-height: 260px; }
</style>
</head>
<body class="antialiased">

<header class="sticky top-0 z-50 border-b border-slate-800 bg-slate-950/90 backdrop-blur-xl">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6">
    <div class="flex items-center gap-3">
      <div class="h-7 w-7 rounded-md bg-sky-500/20 flex items-center justify-center">
        <div class="h-2.5 w-2.5 rounded-sm bg-sky-400"></div>
      </div>
      <div>
        <h1 class="text-sm font-semibold tracking-tight text-slate-100">Pulse99</h1>
        <p class="text-[10px] font-medium text-slate-500 uppercase tracking-widest">Uptime Monitor</p>
      </div>
    </div>
    <div class="hidden items-center gap-2 sm:flex">
      <span id="system-badge" class="inline-flex items-center gap-1.5 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-2.5 py-0.5 text-[11px] font-medium text-emerald-400">
        <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 pulse"></span> Operational
      </span>
    </div>
    <div class="flex items-center gap-4">
      <span id="live-clock" class="font-mono text-xs text-slate-500"></span>
      <span id="conn-dot" class="inline-flex items-center gap-1.5 text-[11px] font-medium text-slate-500">
        <span class="h-2 w-2 rounded-full bg-slate-600"></span> Disconnected
      </span>
    </div>
  </div>
</header>

<main class="mx-auto max-w-7xl px-4 py-6 sm:px-6">
  <div class="mb-6 grid grid-cols-2 gap-3 sm:grid-cols-4">
    <div class="rounded-lg border border-slate-800 bg-slate-900/70 p-3.5">
      <p class="mb-1.5 text-[10px] font-semibold tracking-widest text-slate-500 uppercase">Uptime</p>
      <p id="metric-uptime" class="font-mono text-xl font-bold text-emerald-400">--</p>
    </div>
    <div class="rounded-lg border border-slate-800 bg-slate-900/70 p-3.5">
      <p class="mb-1.5 text-[10px] font-semibold tracking-widest text-slate-500 uppercase">Avg Latency</p>
      <p id="metric-latency" class="font-mono text-xl font-bold text-sky-400">--</p>
    </div>
    <div class="rounded-lg border border-slate-800 bg-slate-900/70 p-3.5">
      <p class="mb-1.5 text-[10px] font-semibold tracking-widest text-slate-500 uppercase">Targets</p>
      <div class="flex items-baseline gap-1.5">
        <p id="metric-targets" class="font-mono text-xl font-bold text-slate-200">0</p>
        <span id="metric-targets-sub" class="text-[11px] text-slate-500"></span>
      </div>
    </div>
    <div class="rounded-lg border border-slate-800 bg-slate-900/70 p-3.5">
      <p class="mb-1.5 text-[10px] font-semibold tracking-widest text-slate-500 uppercase">Alerts</p>
      <p id="metric-incidents" class="font-mono text-xl font-bold text-red-400">0</p>
    </div>
  </div>

  <div class="mb-6 rounded-lg border border-slate-800 bg-slate-900/70 p-4 sm:p-5">
    <div class="mb-3 flex items-center justify-between">
      <h3 class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Response Time</h3>
      <span class="font-mono text-[10px] text-slate-600">last 20 sweeps</span>
    </div>
    <div class="relative"><canvas id="latency-chart"></canvas></div>
  </div>

  <div class="mb-3 flex items-center justify-between">
    <h3 class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Targets</h3>
    <div class="flex gap-3 font-mono text-[11px]">
      <span class="text-slate-500"><span id="count-up">0</span> up</span>
      <span class="text-slate-500"><span id="count-down">0</span> down</span>
      <span class="text-slate-500"><span id="count-unstable">0</span> degraded</span>
    </div>
  </div>

  <div id="target-grid" class="mb-6 grid gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>

  <div class="mb-3 flex items-center justify-between">
    <h3 class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Incident Log</h3>
    <span class="font-mono text-[10px] text-slate-600">auto-refresh 15s</span>
  </div>
  <div class="overflow-hidden rounded-lg border border-slate-800 bg-slate-900/70">
    <div class="max-h-72 overflow-y-auto">
      <table class="w-full text-left text-xs">
        <thead class="sticky top-0 border-b border-slate-800 bg-slate-900">
          <tr class="text-[10px] font-semibold tracking-wider text-slate-500 uppercase">
            <th class="px-4 py-2.5">Time</th>
            <th class="px-4 py-2.5">Target</th>
            <th class="px-4 py-2.5">Event</th>
            <th class="px-4 py-2.5 hidden sm:table-cell">Code</th>
            <th class="px-4 py-2.5 hidden sm:table-cell">Latency</th>
            <th class="px-4 py-2.5 hidden md:table-cell">Details</th>
          </tr>
        </thead>
        <tbody id="history-body" class="font-mono divide-y divide-slate-800/50"></tbody>
      </table>
    </div>
  </div>
</main>

<footer class="border-t border-slate-800 py-3 text-center text-[10px] tracking-wider text-slate-600 uppercase">
  Pulse99 v2.0 &middot; Uptime Monitor
</footer>

<script>
const API = '/api';
let ws = null;
let chart = null;
const latencyHistory = {};
const MAX_CHART_POINTS = 20;
let sweepLabels = [];

const targetColors = ['#38bdf8', '#10b981', '#f59e0b', '#ef4444', '#a78bfa', '#f472b6', '#2dd4bf', '#fb923c'];

function initChart() {
  const ctx = document.getElementById('latency-chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 400 },
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { position: 'bottom', labels: { color: '#94a3b8', usePointStyle: true, pointStyleWidth: 8, padding: 16, font: { size: 10, family: 'Inter' } } },
        tooltip: { backgroundColor: '#1e293b', titleColor: '#e2e8f0', bodyColor: '#94a3b8', borderColor: '#334155', borderWidth: 1, cornerRadius: 6, padding: 8 }
      },
      scales: {
        x: { ticks: { color: '#475569', font: { size: 9 } }, grid: { color: '#1e293b' } },
        y: { beginAtZero: true, ticks: { color: '#475569', font: { size: 9 }, callback: v => v + 'ms' }, grid: { color: '#1e293b' } }
      }
    }
  });
}

function updateChart(targets) {
  if (!chart) return;
  sweepLabels.push('#' + sweepLabels.length);
  if (sweepLabels.length > MAX_CHART_POINTS) sweepLabels.shift();

  targets.forEach((t, i) => {
    if (!latencyHistory[t.name]) latencyHistory[t.name] = [];
    latencyHistory[t.name].push(t.status === 'UP' ? t.latency_ms : null);
    if (latencyHistory[t.name].length > MAX_CHART_POINTS) latencyHistory[t.name].shift();
  });

  const datasets = targets.map((t, i) => ({
    label: t.name,
    data: latencyHistory[t.name] || [],
    borderColor: targetColors[i % targetColors.length],
    backgroundColor: targetColors[i % targetColors.length] + '18',
    borderWidth: 2,
    pointRadius: 1.5,
    pointHoverRadius: 4,
    tension: 0.35,
    spanGaps: false,
  }));

  chart.data.labels = sweepLabels;
  chart.data.datasets = datasets;
  chart.update('none');
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');
  ws.onmessage = (e) => {
    const targets = JSON.parse(e.data);
    renderTargets(targets);
    updateSummary(targets);
    updateMetrics(targets);
    updateChart(targets);
  };
  ws.onopen = () => {
    document.getElementById('conn-dot').innerHTML = '<span class="h-2 w-2 rounded-full bg-emerald-400 pulse"></span> Connected';
    document.getElementById('conn-dot').className = 'inline-flex items-center gap-1.5 text-[11px] font-medium text-emerald-400';
  };
  ws.onclose = () => {
    document.getElementById('conn-dot').innerHTML = '<span class="h-2 w-2 rounded-full bg-red-500"></span> Disconnected';
    document.getElementById('conn-dot').className = 'inline-flex items-center gap-1.5 text-[11px] font-medium text-red-400';
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws.close();
}

function renderTargets(targets) {
  const grid = document.getElementById('target-grid');
  grid.innerHTML = targets.map((t, i) => {
    const isUp = t.status === 'UP';
    const isDown = t.status === 'DOWN';
    const border = isUp ? 'border-emerald-500/20' : isDown ? 'border-red-500/30' : 'border-amber-500/20';
    const bg = isUp ? 'bg-emerald-500/5' : isDown ? 'bg-red-500/5' : 'bg-amber-500/5';
    const dot = isUp ? 'bg-emerald-400' : isDown ? 'bg-red-500' : 'bg-amber-400';
    const statusTag = isUp ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : isDown ? 'text-red-400 bg-red-500/10 border-red-500/20' : 'text-amber-400 bg-amber-500/10 border-amber-500/20';
    const label = isDown ? 'Down' : isUp ? 'Operational' : 'Degraded';
    const code = isUp ? t.status_code : '--';

    return `<div class="animate-fade rounded-lg border ${border} ${bg} p-4 transition-colors duration-200 hover:border-slate-600" style="animation-delay:${i * 35}ms">
      <div class="mb-2.5 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="h-2 w-2 rounded-full ${dot}"></span>
          <span class="text-sm font-semibold text-slate-200">${t.name}</span>
        </div>
        <span class="inline-flex items-center rounded-full border px-2 py-0.5 text-[10px] font-semibold ${statusTag}">${label}</span>
      </div>
      <p class="mb-2.5 font-mono text-[11px] text-slate-500 truncate">${t.url}</p>
      <div class="flex items-center justify-between">
        <div class="flex gap-5">
          <div>
            <p class="text-[10px] text-slate-600 uppercase tracking-wide">Latency</p>
            <p class="font-mono text-base font-bold ${isUp ? 'text-emerald-400' : isDown ? 'text-red-400' : 'text-slate-500'}">${isUp ? t.latency_ms + 'ms' : '--'}</p>
          </div>
          <div>
            <p class="text-[10px] text-slate-600 uppercase tracking-wide">Status</p>
            <p class="font-mono text-base font-bold text-slate-300">${code}</p>
          </div>
        </div>
        <div class="text-right">
          <p class="text-[10px] text-slate-600 uppercase tracking-wide">Failures</p>
          <p class="font-mono text-base font-bold ${t.failure_count > 0 ? 'text-amber-400' : 'text-slate-500'}">${t.failure_count}/${t.threshold}</p>
        </div>
      </div>
    </div>`;
  }).join('');
}

function updateSummary(targets) {
  const up = targets.filter(t => t.status === 'UP').length;
  const down = targets.filter(t => t.status === 'DOWN').length;
  const unstable = targets.filter(t => t.status === 'UNSTABLE').length;
  document.getElementById('count-up').textContent = up;
  document.getElementById('count-down').textContent = down;
  document.getElementById('count-unstable').textContent = unstable;

  const badge = document.getElementById('system-badge');
  if (down > 0) {
    badge.innerHTML = '<span class="h-1.5 w-1.5 rounded-full bg-red-400 pulse"></span> Degraded';
    badge.className = 'inline-flex items-center gap-1.5 rounded-full border border-red-500/30 bg-red-500/10 px-2.5 py-0.5 text-[11px] font-medium text-red-400';
  } else if (unstable > 0) {
    badge.innerHTML = '<span class="h-1.5 w-1.5 rounded-full bg-amber-400 pulse"></span> Degraded';
    badge.className = 'inline-flex items-center gap-1.5 rounded-full border border-amber-500/30 bg-amber-500/10 px-2.5 py-0.5 text-[11px] font-medium text-amber-400';
  } else if (up > 0) {
    badge.innerHTML = '<span class="h-1.5 w-1.5 rounded-full bg-emerald-400 pulse"></span> Operational';
    badge.className = 'inline-flex items-center gap-1.5 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-2.5 py-0.5 text-[11px] font-medium text-emerald-400';
  }
}

function updateMetrics(targets) {
  const total = targets.length;
  const upCount = targets.filter(t => t.status === 'UP').length;
  const downCount = targets.filter(t => t.status === 'DOWN').length;
  const avgLat = targets.filter(t => t.status === 'UP' && t.latency_ms > 0);
  const avgMs = avgLat.length > 0 ? Math.round(avgLat.reduce((s, t) => s + t.latency_ms, 0) / avgLat.length) : 0;
  document.getElementById('metric-uptime').textContent = total > 0 ? Math.round(upCount / total * 100) + '%' : '--';
  document.getElementById('metric-latency').textContent = avgMs > 0 ? avgMs + 'ms' : '--';
  document.getElementById('metric-targets').textContent = total;
  document.getElementById('metric-targets-sub').textContent = upCount + ' healthy';
  document.getElementById('metric-incidents').textContent = downCount;
}

async function loadHistory() {
  try {
    const res = await fetch(API + '/history?limit=50');
    const records = await res.json();
    const tbody = document.getElementById('history-body');
    if (!records || records.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-slate-600">No incidents recorded yet</td></tr>';
      return;
    }
    tbody.innerHTML = records.map(r => {
      const isUp = r.status === 'UP';
      const tagColor = isUp ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-red-400 bg-red-500/10 border-red-500/20';
      return `<tr class="hover:bg-slate-800/50 transition-colors animate-fade">
        <td class="px-4 py-2 text-slate-400 whitespace-nowrap text-[11px]">${new Date(r.timestamp).toLocaleString()}</td>
        <td class="px-4 py-2 text-slate-300 font-semibold">${r.target}</td>
        <td class="px-4 py-2"><span class="inline-flex items-center rounded-full border px-2 py-0.5 text-[10px] font-semibold ${tagColor}">${isUp ? 'Recovered' : 'Down'}</span></td>
        <td class="px-4 py-2 text-slate-400 hidden sm:table-cell text-[11px]">${r.status_code || '--'}</td>
        <td class="px-4 py-2 text-slate-400 hidden sm:table-cell font-mono text-[11px]">${r.latency_ms ? r.latency_ms + 'ms' : '--'}</td>
        <td class="px-4 py-2 text-slate-500 hidden md:table-cell text-[11px] max-w-[180px] truncate">${r.error || '--'}</td>
      </tr>`;
    }).join('');
  } catch(e) { console.error(e); }
}

function updateClock() {
  document.getElementById('live-clock').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
}

loadHistory();
setInterval(loadHistory, 15000);
updateClock();
setInterval(updateClock, 1000);
initChart();
connectWS();
</script>
</body>
</html>
